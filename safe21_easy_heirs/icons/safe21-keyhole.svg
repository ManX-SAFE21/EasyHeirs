<!--
  SAFE21 — plugin icon (square keyhole tile), derived from the official
  safe21.io logo (logos/safe21-logo.svg). Cyber Teal tile with the keyhole
  punched transparent via a mask. Tile enlarged (small margin) and keyhole
  centred, so it fills the status-bar button like the other Electrum icons.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SAFE21">
  <defs>
    <mask id="kh">
      <rect x="4" y="4" width="56" height="56" rx="13" fill="#fff"/>
      <circle cx="32" cy="27" r="8" fill="#000"/>
      <path d="M28 34 L36 34 L38 45 L26 45 Z" fill="#000"/>
    </mask>
  </defs>
  <rect x="4" y="4" width="56" height="56" rx="13" fill="#0D9488" mask="url(#kh)"/>
</svg>
